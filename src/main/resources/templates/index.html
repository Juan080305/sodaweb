<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <head th:replace="~{general/fragmentos :: head}">
        <title>SodaWeb</title>
    </head>
    <body>
        <header th:replace="~{general/fragmentos :: header}"/>

        <section class="container py-5">
            <div class="p-5 bg-white rounded shadow-sm text-center">
                <h2 class="text-soda">[[#{index.bienvenida}]]</h2>
                <p class="lead">[[#{index.descripcion}]]</p>
                <a class="btn btn-soda" th:href="@{/categoria/listado}">
                    <i class="fa-solid fa-layer-group"></i> [[#{plantilla.categorias}]]
                </a>
            </div>
        </section>

        <footer th:replace="~{general/fragmentos :: footer}"/>
    </body>
</html>
