<!DOCTYPE html>

    <head th:replace="~{general/fragmentos :: head}">
        <title>SodaWeb</title>
    </head>
    <body>

                <div class="mt-3">
                    <a class="btn btn-soda" th:href="@{/}"><i class="fa-solid fa-utensils"></i> [[#{carrito.verMenu}]]</a>
                </div>
            </div>
        </section>

        <footer th:replace="~{general/fragmentos :: footer}"/>
    </body>
</html>
