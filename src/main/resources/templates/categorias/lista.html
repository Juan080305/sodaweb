<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Categorías | SodaWeb</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-success"><div class="container"><a class="navbar-brand" href="/">SodaWeb</a><span class="navbar-text text-white">Administración de categorías</span></div></nav><main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h3">Categorías</h1><a class="btn btn-success" href="/admin/categorias/nueva">Nueva categoría</a></div><div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div><div class="table-responsive bg-white rounded shadow-sm"><table class="table table-striped align-middle mb-0"><thead><tr><th>ID</th><th>Nombre</th><th>Descripción</th><th>Estado</th><th>Acciones</th></tr></thead><tbody><tr th:each="c : ${categorias}"><td th:text="${c.id}"></td><td th:text="${c.nombre}"></td><td th:text="${c.descripcion}"></td><td><span class="badge" th:classappend="${c.activa} ? ' text-bg-success' : ' text-bg-secondary'" th:text="${c.activa} ? 'Activa' : 'Inactiva'"></span></td><td><div class="d-flex gap-2"><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/categorias/{id}/editar(id=${c.id})}">Editar</a><form th:if="${c.activa}" th:action="@{/admin/categorias/{id}/desactivar(id=${c.id})}" method="post"><button class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Desactivar esta categoría?')">Desactivar</button></form><form th:unless="${c.activa}" th:action="@{/admin/categorias/{id}/activar(id=${c.id})}" method="post"><button class="btn btn-sm btn-outline-success">Activar</button></form></div></td></tr><tr th:if="${#lists.isEmpty(categorias)}"><td colspan="5" class="text-center py-4">Todavía no hay categorías registradas.</td></tr></tbody></table></div></main></body></html>
