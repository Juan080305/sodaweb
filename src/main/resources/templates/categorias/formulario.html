<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editar categoría | SodaWeb</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-success"><div class="container"><a class="navbar-brand" href="/">SodaWeb</a></div></nav><main class="container py-5" style="max-width:700px"><h1 class="h3 mb-4" th:text="${categoria.id == null} ? 'Nueva categoría' : 'Editar categoría'"></h1><form class="card card-body shadow-sm" th:action="@{/admin/categorias/guardar}" th:object="${categoria}" method="post"><input type="hidden" th:field="*{id}"><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><div class="mb-3"><label class="form-label">Nombre *</label><input class="form-control" th:field="*{nombre}" maxlength="100" required><div class="text-danger small" th:errors="*{nombre}"></div></div><div class="mb-3"><label class="form-label">Descripción</label><textarea class="form-control" th:field="*{descripcion}" maxlength="255" rows="3"></textarea><div class="text-danger small" th:errors="*{descripcion}"></div></div><div class="form-check mb-4"><input class="form-check-input" type="checkbox" th:field="*{activa}"><label class="form-check-label">Categoría activa</label></div><div class="d-flex gap-2"><button class="btn btn-success">Guardar</button><a class="btn btn-outline-secondary" href="/admin/categorias">Cancelar</a></div></form></main></body></html>
