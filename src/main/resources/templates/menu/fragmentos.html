<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <head th:replace="~{general/fragmentos :: head}"/>
    <body>
        <!-- fragmento 1 con las "tabs" de categorías del menú (HU-01) -->
        <section th:fragment="tabs" class="py-3 mb-2">
            <div class="d-flex justify-content-center px-3 overflow-auto">
                <ul class="nav nav-underline flex-nowrap">
                    <li class="nav-item">
                        <a th:href="@{/}"
                           th:classappend="${idCategoriaActual == null} ? 'active'"
                           class="nav-link text-nowrap"
                           aria-current="page">
                            [[#{menu.todas}]]
                        </a>
                    </li>
                    <li th:each="c : ${categorias}" class="nav-item">
                        <a th:href="@{/menu/{id}(id=${c.idCategoria})}"
                           th:classappend="${idCategoriaActual != null and idCategoriaActual.equals(c.idCategoria)} ? 'active'"
                           class="nav-link text-nowrap">
                            [[${c.descripcion}]]
                        </a>
                    </li>
                </ul>
            </div>
        </section>

        <!-- fragmento 2 para el listado de tarjetas de productos del menú (HU-01) -->
        <section th:fragment="tarjetas" class="container py-3">
            <div th:if="${productos == null or productos.empty}" class="text-center text-muted p-5">
                <i class="fa-solid fa-bowl-rice fs-1"></i>
                <p class="mt-2">[[#{menu.vacio}]]</p>
            </div>
            <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-4">
                <div th:each="p : ${productos}" class="col">
                    <div class="card h-100 shadow-sm tarjeta">
                        <a th:href="@{/menu/producto/{id}(id=${p.idProducto})}"
                           class="d-flex justify-content-center align-items-center bg-light p-3 imagen-producto text-decoration-none">
                            <img th:if="${p.rutaImagen != null}" th:src="${p.rutaImagen}" class="img-fluid"
                                 th:alt="${p.descripcion}"/>
                            <i th:unless="${p.rutaImagen != null}" class="fa-solid fa-utensils fs-1 text-soda"></i>
                        </a>
                        <div class="card-header bg-white">
                            <h5 class="card-title text-center text-truncate mb-0" th:text="${p.descripcion}">Título</h5>
                        </div>
                        <div class="card-body d-flex flex-column">
                            <p class="card-text text-muted mb-auto text-truncate" th:text="${p.detalle}">Detalle</p>
                        </div>
                        <div class="card-footer bg-white d-flex justify-content-between align-items-center">
                            <div class="fw-bold">
                                <span class="text-success h5" th:text="'₡' + ${#numbers.formatDecimal(p.precio, 1, 'WHITESPACE', 0, 'POINT')}">₡0</span>
                                <span th:if="${p.agotado}" class="badge text-bg-danger ms-2">[[#{menu.agotado}]]</span>
                            </div>
                            <a th:href="@{/menu/producto/{id}(id=${p.idProducto})}" class="btn btn-sm btn-outline-success">
                                [[#{menu.verDetalle}]]
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- fragmento 3 con el detalle de un producto (HU-02) -->
        <section th:fragment="detalle" class="container py-4">
            <div class="card shadow-sm">
                <div class="row g-0">
                    <div class="col-md-5 d-flex justify-content-center align-items-center bg-light p-4" style="min-height: 280px;">
                        <img th:if="${producto.rutaImagen != null}" th:src="${producto.rutaImagen}" class="img-fluid rounded"
                             th:alt="${producto.descripcion}" style="max-height: 320px;"/>
                        <i th:unless="${producto.rutaImagen != null}" class="fa-solid fa-utensils text-soda" style="font-size: 6rem;"></i>
                    </div>
                    <div class="col-md-7">
                        <div class="card-body p-4">
                            <span class="badge text-bg-light border mb-2">[[${producto.categoria.descripcion}]]</span>
                            <h2 class="card-title">[[${producto.descripcion}]]</h2>
                            <p class="h3 text-success" th:text="'₡' + ${#numbers.formatDecimal(producto.precio, 1, 'WHITESPACE', 0, 'POINT')}">₡0</p>
                            <p class="card-text" th:text="${producto.detalle}">Detalle</p>

                            <div th:if="${producto.agotado}" class="alert alert-danger d-flex align-items-center" role="alert">
                                <i class="fa-solid fa-ban me-2"></i> [[#{menu.agotado.texto}]]
                            </div>
                            <p th:unless="${producto.agotado}" class="text-success">
                                <i class="fa-solid fa-circle-check"></i> [[#{menu.disponible}]]
                            </p>

                            <div class="d-flex flex-wrap gap-2 mt-3">
                                <a th:href="@{/menu/{id}(id=${producto.categoria.idCategoria})}" class="btn btn-outline-secondary">
                                    <i class="fa-solid fa-arrow-left"></i> [[#{menu.regresar}]]
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </body>
</html>
