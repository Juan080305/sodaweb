spring.application.name=sodaweb

#para definir el puerto donde "escuchara" el servidor
server.port=80

#Se define el formato de fecha/hora del log del servidor web
logging.pattern.dateformat=HH:mm:ss

#Se define no presentar el banner de SPRING en el log del servidor
spring.main.banner-mode=off

#Se evita el uso de cache en desarrollo, en produccion si se debe usar.
spring.thymeleaf.cache=false

#Conexion local a la BD sodaweb en MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/sodaweb?serverTimezone=America/Costa_Rica
#Conexion NUBE AIVEN la BD sodaweb en MySQL
#spring.datasource.url=jdbc:mysql://sodaweb-sodaweb-xxxx.aivencloud.com:xxxx/sodaweb

#Usuario y clave de creaTablas.sql
spring.datasource.username=usuario_sodaweb
spring.datasource.password=Soda_Clave.

#Driver y plataforma de comunicacion
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#mostrar informacion en el log para desarrollo... en produccion se reducen
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
